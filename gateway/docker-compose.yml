services:
  caddy-gateway:
    image: caddy:2.11.4-alpine
    container_name: caddy-gateway
    restart: unless-stopped
    ports:
      - "9088:9088"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 访问日志目录（宿主机路径由 install.sh 写入 gateway/.env 的 LOG_DIR）
      - ${LOG_DIR:-./logs}:/logs
    environment:
      START_PAGE_REFRESH: ${START_PAGE_REFRESH:-5}
    networks:
      - dagu-net

networks:
  dagu-net:
    external: true
