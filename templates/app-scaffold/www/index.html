<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Worker 脚手架</title>
<style>
body{font-family:sans-serif;background:#0f1115;color:#e6e6e6;padding:24px}
code{color:#00ff88}
pre{background:#161b26;border:1px solid #2a2f3a;border-radius:8px;padding:12px;overflow:auto;max-height:60vh}
#status{margin:8px 0;color:#9aa3b2}
</style>
</head>
<body>
<h1>App Worker 脚手架 <span id="ver"></span></h1>
<p>数据源：<code>/svc/spec</code>（快照唯一数据源）· 实时推送：<code>/svc/events</code>（SSE，事件名 spec）</p>
<div id="status">加载中…</div>
<pre id="out"></pre>
<script>
// 页面挂在 /app/<port>/ 下：以页面 URL 计算应用基址
const APP_BASE = (() => {
  const m = location.pathname.match(/^(\/app\/[0-9]+)(\/|$)/);
  return m ? m[1] + "/" : "";
})();

async function render() {
  try {
    const r = await fetch(APP_BASE + "svc/spec", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const spec = d && d.spec;
    if (!spec) {
      document.getElementById("status").textContent = "spec 为空（请 POST /svc/spec 入库）";
      return;
    }
    document.title = spec.title || document.title;
    const h1 = document.querySelector("h1 span");
    if (h1) h1.textContent = spec.title || "App Worker";
    document.getElementById("status").textContent =
      "spec 已加载：kpis=" + (spec.kpis || []).length +
      " charts=" + (spec.charts || []).length +
      " tables=" + (spec.tables || []).length +
      " sync_at=" + (spec.sync_at || "-");
    document.getElementById("out").textContent =
      JSON.stringify(spec, null, 2).slice(0, 4000);
  } catch (e) {
    document.getElementById("status").textContent = "spec 加载失败：" + e;
  }
}

render();
// 实时推送：SSE（EventSource 自带断线重连），只订阅 spec 事件
const es = new EventSource(APP_BASE + "svc/events");
es.addEventListener("spec", render);
es.onerror = () => {};
setInterval(render, 30000); // 轮询兜底
</script>
</body>
</html>
